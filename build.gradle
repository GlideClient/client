buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { name = "forge"; url = "https://maven.minecraftforge.net" }
        maven { name = "sponge"; url = "https://repo.spongepowered.org/maven" }
        maven { name = "jitpack"; url = "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.github.glideclient:ForgeGradle:2.1-SNAPSHOT'
        classpath "com.github.glideclient:MixinGradle:0.6-SNAPSHOT"
        classpath "com.github.johnrengelman.shadow:com.github.johnrengelman.shadow.gradle.plugin:6.1.0"
    }
}

apply plugin: 'net.minecraftforge.gradle.tweaker-client'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'java'

System.setProperty("forgegradle.extraction.enabled", "false")

version = "Release"
group = "me.eldodebug"
archivesBaseName = "GlideClient"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "1.8.9"
    tweakClass = "me.eldodebug.soar.injection.mixin.GlideTweaker"
    runDir = "run"
    mappings = "stable_22"
    clientJvmArgs = ["-XX:-DisableExplicitGC"]
    makeObfSourceJar = false

    // mac arm64 support
    runClient {
        def osName = System.getProperty("os.name").toLowerCase()
        def osArch = System.getProperty("os.arch").toLowerCase()
        if (osName.contains("mac") && (osArch.contains("arm") || osArch.contains("aarch64"))) {
            println "[INFO] Trying to path LWJGL 2 to support Apple ARM64 "
            def bodgePath = file("libs/mac/arm64/natives").absolutePath // absolute clown more like
            println "[INFO] Apple Silicone Natives path ${bodgePath}"
            jvmArgs "-Djava.library.path=${bodgePath}"
            println "[INFO] LWJGL 2 perhaps patched to work with Apple Silicone, good luck..."
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "minecraft-libraries"
        url = "https://libraries.minecraft.net"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "spongepowered"
        url = "https://repo.spongepowered.org/maven/"
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
    annotationProcessor.extendsFrom(embed)

    runtimeOnly { // runClient fails without this
        canBeResolved = true
    }
}

dependencies {
    annotationProcessor('org.spongepowered:mixin:0.7.11-SNAPSHOT')

    // mixins
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'launchwrapper'
        exclude module: 'guava'
        exclude module: 'gson'
        exclude module: 'commons-io'
    }

    // LWJGL 3 nanovg
    embed(files('libs/lwjgl-soar.jar'))
    embed(files('libs/lwjgl-soar-natives.jar'))

    // Hardware info
    embed('com.github.oshi:oshi-core:6.9.0') {
        exclude module: 'slf4j-api'
    }
}

mixin {
    // add both serge and notch to the refmap
    defaultObfuscationEnv = "searge"
    add sourceSets.main, "mixins.soar.refmap.json"
    // experimental, it should make it work on both forge and as a client however forge is not gonna be supported if it breaks as glide was never intended to support it, but may aswell remove the barrier if possible
}

// fix fucky Shadow + FG issues
afterEvaluate {
    tasks.named("runClient").configure {
        classpath = configurations.embed + classpath 
    }
}

tasks.named("processResources", ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property "version", project.version

    from(sourceSets.main.resources.srcDirs) {
        include '**/*'
    }
}

shadowJar {
    configurations = [project.configurations.embed]

    relocate 'oshi', 'com.glideclient.libs.oshi'

    archiveClassifier.set('')

    manifest {
        attributes(
                "MixinConfigs": 'mixins.soar.json',
                "TweakClass": 'me.eldodebug.soar.injection.mixin.GlideTweaker',
                "TweakOrder": 0,
                "Manifest-Version": 1.0,
                'FMLAT': 'soar_at.cfg'
        )
    }
}

reobf {
    shadowJar {}
}

build.dependsOn shadowJar